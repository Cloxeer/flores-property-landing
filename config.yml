    introBand:
      eyebrow: Meet Anela
      heading: Local. Clear. On your side.
      body: Buying or selling a home is a big step. Anela Flores, a Las Cruces
        Realtor, keeps every deadline, document and decision in plain view so
        you always know what happens next.
      image: images/organ-mountains-moon.jpg
      imageAlt: Moon rising behind the Organ Mountains
      ctaLabel: About Anela
    services:
      heading: How I can help
      cards:
        - title: Buying a home
          body: Find the right home in Las Cruces, make a strong offer, and get through
            inspection and closing with confidence.
          ctaLabel: Learn more
        - title: Selling your home
          body: Price it right, prepare it well, and keep every step to closing clear.
          ctaLabel: Learn more
        - title: First-time buyers
          body: Plain-language answers on financing, timelines and what to expect, one
            step at a time.
          ctaLabel: Learn more
        - title: Moving to Las Cruces
          body: New to the Mesilla Valley? Get a local's view of neighborhoods before you
            commit.
          ctaLabel: Learn more
    about:
      heading: Hi, I'm Anela.
      image: images/organ-mountains-desert.jpg
      imageAlt: Organ Mountains rising over the Chihuahuan Desert near Las Cruces
      paragraphs:
        - I'm Anela Flores, a Realtor in Las Cruces, New Mexico, and I lead the
          Flores Property Group.
        - I've called Las Cruces home since 2002 and studied Communication and
          Business at New Mexico State University. I work with buyers, sellers
          and investors across the city.
        - My approach is simple. I explain every step, keep every deadline
          visible, and make sure you never have to wonder what comes next.
      ctaLabel: Let's talk
    mission:
      blocks:
        - title: Clarity first
          body: Plain-language updates and clear timelines, so there are no surprises.
        - title: Every deadline covered
          body: Contract dates, inspections, financing and closing are tracked so nothing
            slips.
        - title: Local to Las Cruces
          body: Neighborhood knowledge across Las Cruces and the Mesilla Valley.
    ctaBand:
      heading: Ready for the next step?
      body: Tell me where you are in your home journey and we'll map out what comes
        next.
