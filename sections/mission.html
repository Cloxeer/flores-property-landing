<!-- mission — three stacked heading + paragraph blocks (3 columns on desktop, 1 on mobile). -->
<section class="mission section section-surface" data-halite-section="mission">
  <div class="container grid grid-3">
    <div class="mission-block" data-reveal>
      <h3 class="subheading" data-halite-path='["custom","mission","blocks",0,"title"]'>Sub-block one heading</h3>
      <p class="body-text" data-halite-path='["custom","mission","blocks",0,"body"]'>Short paragraph placeholder for the first sub-block.</p>
    </div>
    <div class="mission-block" data-reveal>
      <h3 class="subheading" data-halite-path='["custom","mission","blocks",1,"title"]'>Sub-block two heading</h3>
      <p class="body-text" data-halite-path='["custom","mission","blocks",1,"body"]'>Short paragraph placeholder for the second sub-block.</p>
    </div>
    <div class="mission-block" data-reveal>
      <h3 class="subheading" data-halite-path='["custom","mission","blocks",2,"title"]'>Sub-block three heading</h3>
      <p class="body-text" data-halite-path='["custom","mission","blocks",2,"body"]'>Short paragraph placeholder for the third sub-block.</p>
    </div>
  </div>
</section>
