<!-- hero — full-bleed dark image with overlay, centered serif headline, two pill CTAs,
     and a warm-sand arc divider at the bottom edge (reveal-on-scroll via [data-reveal]). -->
<section class="hero" data-halite-section="hero">
  <img class="hero-bg" loading="eager" fetchpriority="high" data-halite-path='["custom","hero","image"]' data-halite-image="true"
       src="images/hero-sunset.svg" alt="New Mexico sunset over the desert"
       data-halite-alt-path='["custom","hero","imageAlt"]' />
  <div class="hero-overlay"></div>

  <div class="hero-content container" data-reveal>
    <p class="eyebrow eyebrow-on-dark" data-halite-path='["custom","hero","eyebrow"]'>EYEBROW · SHORT KICKER</p>
    <h1 class="hero-headline" data-halite-path='["custom","hero","headline"]'>Primary hero headline placeholder across two lines</h1>
    <p class="hero-subhead" data-halite-path='["custom","hero","subhead"]'>Supporting hero sentence placeholder that sets context in one or two lines.</p>
    <div class="hero-ctas">
      <a class="btn btn-primary" href="contact.html" data-halite-path='["custom","hero","ctaPrimaryLabel"]'>Primary action</a>
      <a class="btn btn-outline-on-dark" href="services.html" data-halite-path='["custom","hero","ctaSecondaryLabel"]'>Secondary action</a>
    </div>
  </div>

  <div class="hero-arc" aria-hidden="true"></div>
</section>
