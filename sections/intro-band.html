<!-- introBand — split layout: copy on one side, image on the other (image side set in config). -->
<section class="intro-band section section-surface" data-halite-section="introBand">
  <div class="container split" data-reveal>
    <div class="split-text">
      <p class="eyebrow" data-halite-path='["custom","introBand","eyebrow"]'>Short eyebrow</p>
      <h2 class="section-title" data-halite-path='["custom","introBand","heading"]'>Three-phrase value statement placeholder</h2>
      <p class="lede" data-halite-path='["custom","introBand","body"]'>One short paragraph placeholder introducing the brand and what sets it apart.</p>
      <a class="btn btn-text" href="about.html" data-halite-path='["custom","introBand","ctaLabel"]'>Learn more</a>
    </div>
    <div class="split-media">
      <img class="rounded-media" data-halite-path='["custom","introBand","image"]' data-halite-image="true"
           src="images/dusk-portrait.svg" alt="Desert dusk over Las Cruces"
           data-halite-alt-path='["custom","introBand","imageAlt"]' />
    </div>
  </div>
</section>
